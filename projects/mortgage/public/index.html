<!DOCTYPE html>
<html lang="ko">
<head>
  <script src="/shared-assets/auth-guard.js"></script>
  <script src="/shared-assets/feedback-widget.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🏦 주택담보대출 상담 준비</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="app-header">
    <h1>🏦 주택담보대출 상담 준비</h1>
    <span class="badge">localStorage · 이 기기에만 저장</span>
    <div class="header-actions">
      <button class="btn btn-ghost" id="btnCompareToggle">⇄ 비교모드</button>
      <button class="btn btn-ghost" id="btnExport">⬇ 내보내기</button>
      <button class="btn btn-ghost" id="btnImport">⬆ 불러오기</button>
      <input type="file" id="fileImport" accept="application/json" hidden>
      <button class="btn btn-ghost" id="btnPrint">🖨 인쇄</button>
    </div>
  </header>

  <div class="container">
    <div class="info-box">
      🔒 모든 입력 데이터는 이 브라우저의 localStorage에만 저장되며 서버로 전송되지 않습니다 — admin을 포함해 다른 사람은 조회할 수 없습니다. 기기를 바꾸거나 백업하려면 "내보내기"로 JSON 파일을 저장해두세요.
    </div>

    <div class="case-tabs" id="caseTabs"></div>

    <div id="emptyState" class="card" style="display:none;">
      <p>아직 케이스가 없습니다. 위 "+ 새 케이스"로 상담받을 은행·상품별 케이스를 만들어보세요.</p>
    </div>

    <div id="compareView" style="display:none;"></div>

    <div id="caseDetail"></div>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/calc.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
