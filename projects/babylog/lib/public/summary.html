<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>하루 요약</title>
<style>
  :root {
    color-scheme: light;
    --page: #f6f1ea; --surface: #fcfcfb; --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
    --grid: #e1e0d9; --axis: #c3c2b7; --ring: rgba(11,11,11,0.10); --accent: #d8693a;
    --sleep: #2a78d6; --nap: #86b6ef; --feed: #eb6834; --diaper: #1baf7a; --other: #898781;
    --radius: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
      --grid: #2c2c2a; --axis: #383835; --ring: rgba(255,255,255,0.10); --accent: #e8814f;
      --sleep: #3987e5; --nap: #1c5cab; --feed: #d95926; --diaper: #199e70;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --axis: #383835; --ring: rgba(255,255,255,0.10); --accent: #e8814f;
    --sleep: #3987e5; --nap: #1c5cab; --feed: #d95926; --diaper: #199e70;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--page); color: var(--ink); font: 16px/1.5 system-ui, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; -webkit-tap-highlight-color: transparent; }
  main { max-width: 560px; margin: 0 auto; padding: 16px 16px 40px; }
  .card { background: var(--surface); border: 1px solid var(--ring); border-radius: var(--radius); padding: 14px; margin-bottom: 12px; }
  .muted { color: var(--muted); font-size: 13px; }

  header { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 4px; }
  .who { font-size: 20px; font-weight: 700; }
  .who small { font-size: 13px; font-weight: 400; color: var(--ink-2); margin-left: 6px; }
  #babySel { font: inherit; font-size: 18px; font-weight: 700; border: 0; background: none; color: var(--ink); padding: 0; }
  .icon { border: 1px solid var(--ring); background: var(--surface); color: var(--ink); border-radius: 10px; padding: 6px 12px; font-size: 14px; }
  .datenav { display: flex; align-items: center; justify-content: space-between; margin: 8px 0 14px; }
  .datenav button { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--ring); background: var(--surface); color: var(--ink); font-size: 18px; }
  .datenav button:disabled { opacity: .3; }
  #dateLabel { font-weight: 600; font-size: 17px; text-align: center; }
  #dateLabel .today { display: block; font-size: 12px; font-weight: 500; color: var(--accent); }

  .now { display: flex; flex-direction: column; gap: 6px; }
  .now-row { display: flex; align-items: baseline; gap: 8px; font-size: 15px; }
  .now-row .sw { width: 10px; height: 10px; border-radius: 3px; flex: none; transform: translateY(1px); }
  .now-row b { font-size: 17px; }
  .now-row .muted { margin-left: auto; }

  .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
  .tile { background: var(--surface); border: 1px solid var(--ring); border-radius: var(--radius); padding: 12px 14px; }
  .tile .lbl { font-size: 13px; color: var(--ink-2); display: flex; align-items: center; gap: 6px; }
  .tile .lbl .sw { width: 8px; height: 8px; border-radius: 2px; }
  .tile .val { font-size: 26px; font-weight: 700; line-height: 1.25; margin-top: 2px; }
  .tile .val small { font-size: 14px; font-weight: 500; color: var(--ink-2); margin-left: 2px; }
  .tile .sub { font-size: 12px; color: var(--muted); }

  h2 { font-size: 15px; margin: 0 0 10px; display: flex; justify-content: space-between; align-items: center; }
  .chart { position: relative; }
  .chart svg { display: block; width: 100%; overflow: visible; }
  .chart text { font-size: 11px; fill: var(--muted); font-variant-numeric: tabular-nums; }
  .chart .lane-lbl { font-size: 12px; fill: var(--ink-2); }
  .chart .val-lbl { font-size: 12px; fill: var(--ink); font-weight: 600; }
  .tip { position: absolute; pointer-events: none; background: var(--ink); color: var(--surface); font-size: 12px; line-height: 1.4; padding: 6px 8px; border-radius: 8px; white-space: nowrap; transform: translate(-50%, calc(-100% - 10px)); z-index: 2; }
  .hit { cursor: pointer; }

  .seg { display: inline-flex; border: 1px solid var(--ring); border-radius: 10px; overflow: hidden; }
  .seg button { border: 0; background: none; color: var(--ink-2); font-size: 13px; padding: 5px 10px; }
  .seg button.on { background: var(--ink); color: var(--surface); }

  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  td { padding: 8px 0; border-top: 1px solid var(--grid); vertical-align: top; }
  td.t { width: 56px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
  td .sw { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; }
  td .by { color: var(--muted); font-size: 12px; }
  .empty { color: var(--muted); font-size: 14px; padding: 8px 0; }
  .err { color: #d03b3b; font-size: 14px; }
  .viewseg { display: flex; width: 100%; margin: 6px 0 2px; }
  .viewseg button { flex: 1; padding: 9px; font-size: 15px; }
  .legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12px; color: var(--ink-2); margin: -2px 0 10px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
  .legend i.dot { border-radius: 50%; }
  .delta { font-size: 12px; color: var(--ink-2); font-weight: 500; }
  .caption { font-size: 13px; color: var(--ink-2); margin: 0 0 8px; }
  .fab { display: block; width: 100%; margin-top: 4px; padding: 14px; border: 0; border-radius: var(--radius); background: var(--accent); color: #fff; font-size: 16px; font-weight: 600; }
  .skeleton { opacity: .4; }
</style>
</head>
<body>
<main>
  <header>
    <div class="who"><span id="babyName"></span><select id="babySel" hidden aria-label="아기 선택"></select><small id="babyAge"></small></div>
    <button class="icon" id="refreshBtn" aria-label="새로고침">새로고침</button>
  </header>

  <div class="seg viewseg" id="viewSeg" role="tablist">
    <button data-v="day" class="on" role="tab">하루</button><button data-v="pattern" role="tab">패턴</button>
  </div>

  <div class="datenav">
    <button id="prevBtn" aria-label="전날">‹</button>
    <div id="dateLabel"></div>
    <button id="nextBtn" aria-label="다음날">›</button>
  </div>

  <div id="err" class="err" hidden></div>

  <div id="dayView">
  <div class="card now" id="nowCard" hidden></div>

  <div class="tiles" id="tiles"></div>

  <div class="card">
    <h2>24시간 타임라인</h2>
    <div class="chart" id="timeline"></div>
  </div>

  <div class="card">
    <h2>최근 7일
      <span class="seg" id="metricSeg">
        <button data-m="ml" class="on">수유량</button><button data-m="diapers">기저귀</button><button data-m="sleep_min">수면</button>
      </span>
    </h2>
    <div class="chart" id="trend"></div>
  </div>

  <div class="card">
    <h2>기록 <span class="muted" id="eventCount"></span></h2>
    <table><tbody id="eventRows"></tbody></table>
  </div>

  </div><!-- /dayView -->

  <div id="patternView" hidden>
    <p class="caption" id="pCaption">최근 7일 평균 (오늘 제외)</p>
    <div class="tiles" id="pTiles"></div>
    <div class="card" id="pEmpty" hidden><p class="empty" style="margin:0">수면 기록이 며칠 쌓이면 패턴이 보여요. 기록 탭에서 "잠들었어요"·"깼어요"를 눌러 주세요.</p></div>
    <div class="card">
      <h2>수면 패턴 <span class="muted">시간대별</span></h2>
      <div class="legend"><span><i style="background:var(--sleep)"></i>밤잠</span><span><i style="background:var(--nap)"></i>낮잠</span><span><i class="dot" style="background:var(--feed)"></i>수유</span></div>
      <div class="chart" id="heatmap"></div>
    </div>
    <div class="card">
      <h2>하루 수면 시간</h2>
      <div class="legend"><span><i style="background:var(--sleep)"></i>밤잠</span><span><i style="background:var(--nap)"></i>낮잠</span></div>
      <div class="chart" id="sleepBars"></div>
    </div>
    <div class="card">
      <h2>깨어 있는 시간 <span class="muted">잠 사이 평균</span></h2>
      <div class="chart" id="wakeLine"></div>
    </div>
    <p class="muted" id="pNote">평균은 기록이 있는 지난 날로만 계산해요 (오늘은 진행 중이라 빠져요). 깨어 있는 시간은 연속한 두 잠 사이 간격이고, 8시간이 넘는 간격은 기록이 빠진 것으로 보고 제외했어요. 막대를 누르면 그날 하루 화면으로 이동해요.</p>
  </div>

  <button class="fab" id="recordBtn" hidden>기록하러 가기</button>
  <button class="icon" id="exportBtn" style="display:block;width:100%;margin-top:10px;padding:12px">최근 30일 기록 내보내기 (CSV)</button>
</main>
<script src="summary.js"></script>
</body>
</html>
