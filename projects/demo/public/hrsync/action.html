<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>기준정보 정합성 점검 - 불일치 유형별 조치</title>
<style>
  :root{
    --bg:#f4f6f9; --panel:#fff; --line:#e3e7ee; --text:#1f2937; --sub:#6b7280; --pri:#1d4ed8; --pri-l:#e8efff;
    --MISSING:#b91c1c; --MISSING-l:#fdecec;
    --ORPHAN:#6d28d9;  --ORPHAN-l:#f1eafe;
    --DIFF:#b45309;    --DIFF-l:#fff4e0;
    --EXCESS:#be185d;  --EXCESS-l:#fde8f1;
    --LACK:#0369a1;    --LACK-l:#e3f2fb;
    --SOD:#111827;     --SOD-l:#e5e7eb;
    --ok:#15803d; --ok-l:#e7f6ec; --wait:#a16207; --wait-l:#fef6d8; --fail:#b91c1c; --fail-l:#fdecec;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Pretendard","Malgun Gothic","Apple SD Gothic Neo",sans-serif;background:var(--bg);color:var(--text);font-size:13px}
  header{background:#0f2a5c;color:#fff;padding:14px 24px;display:flex;align-items:center;justify-content:space-between}
  header h1{margin:0;font-size:17px}
  header .meta{font-size:12px;opacity:.8}
  main{padding:18px 24px;max-width:1560px;margin:0 auto}
  .panel{background:#fff;border:1px solid var(--line);border-radius:8px;padding:14px 16px;margin-bottom:14px}
  h2{font-size:14px;margin:0 0 10px;display:flex;align-items:center;gap:8px}
  h2 small{font-weight:400;color:var(--sub);font-size:12px}

  /* 정책 카드 */
  .policy{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
  .pc{border:1px solid var(--line);border-top:4px solid var(--c);border-radius:8px;padding:12px;cursor:pointer;background:#fff;transition:.15s;display:flex;flex-direction:column;gap:6px}
  .pc:hover{box-shadow:0 2px 10px rgba(0,0,0,.06)}
  .pc.on{background:var(--cl);outline:2px solid var(--c)}
  .pc .nm{font-weight:700;color:var(--c);font-size:14px}
  .pc .ex{font-size:12px;color:var(--sub);min-height:32px;line-height:1.4}
  .pc .ac{font-size:12px;font-weight:600}
  .pc .cnt{display:flex;justify-content:space-between;align-items:flex-end;margin-top:4px}
  .pc .cnt b{font-size:22px;color:var(--c)}
  .pc .cnt span{font-size:11px;color:var(--sub)}
  .mode{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:9px;width:max-content}
  .m-auto{background:var(--ok-l);color:var(--ok)}
  .m-alert{background:#ede9fe;color:#5b21b6}
  .m-appr{background:var(--wait-l);color:var(--wait)}

  /* 조건/툴바 */
  .bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
  .bar .l,.bar .r{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  select,input[type=text]{height:32px;border:1px solid #cfd6e1;border-radius:6px;padding:0 10px;font-size:13px;background:#fff}
  button{height:32px;border:0;border-radius:6px;padding:0 14px;font-size:13px;cursor:pointer;font-weight:600}
  button:disabled{opacity:.5;cursor:not-allowed}
  .btn-pri{background:var(--pri);color:#fff}
  .btn-line{background:#fff;border:1px solid #cfd6e1;color:var(--text)}
  .btn-ok{background:var(--ok);color:#fff}
  .btn-ng{background:#fff;border:1px solid var(--fail);color:var(--fail)}
  .btn-xs{height:24px;padding:0 9px;font-size:11px;border-radius:4px}
  .sw{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--sub)}
  .prog{flex:1;min-width:200px;max-width:340px;height:8px;background:#eef1f5;border-radius:4px;overflow:hidden;display:none}
  .prog i{display:block;height:100%;width:0;background:var(--pri);transition:width .2s}

  /* 테이블 */
  .layout{display:grid;grid-template-columns:1fr;gap:14px}
  .layout.open{grid-template-columns:1fr 420px}
  .tbl-wrap{overflow:auto;max-height:520px;border:1px solid var(--line);border-radius:6px;margin-top:10px}
  table{border-collapse:collapse;width:100%}
  thead th{position:sticky;top:0;background:#f7f9fc;border-bottom:1px solid var(--line);padding:8px 10px;text-align:left;font-size:12px;white-space:nowrap;z-index:1}
  tbody td{border-bottom:1px solid #f0f2f5;padding:8px 10px;vertical-align:middle}
  tbody tr{cursor:pointer}
  tbody tr:hover{background:#fafbfe}
  tbody tr.sel{background:var(--pri-l)}
  tbody tr.flash{animation:fl 1s}
  @keyframes fl{0%{background:#fff7c2}100%{background:transparent}}
  .tp{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:700;white-space:nowrap}
  .id{font-family:Consolas,monospace;font-size:12px;color:var(--sub)}
  .who b{display:block}
  .who span{font-size:11px;color:var(--sub)}
  .vs{display:flex;flex-direction:column;gap:2px;font-size:12px}
  .vs .e{color:var(--text)} .vs .t{color:var(--sub)}
  .vs .e::before{content:'ERP ';font-weight:700;color:var(--pri);font-size:10.5px}
  .vs .t::before{content:'대상 ';font-weight:700;color:#9ca3af;font-size:10.5px}
  .rule{font-size:11.5px;color:var(--sub)}
  .st{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:700;white-space:nowrap}
  .s-PENDING{background:#eef1f5;color:#4b5563}
  .s-RUNNING{background:var(--pri-l);color:var(--pri)}
  .s-DONE{background:var(--ok-l);color:var(--ok)}
  .s-WAIT{background:var(--wait-l);color:var(--wait)}
  .s-FAIL{background:var(--fail-l);color:var(--fail)}
  .s-REJECT{background:#f3f4f6;color:#6b7280}
  .s-SIM{background:#ecfeff;color:#0e7490}
  .lock{font-size:10.5px;color:var(--fail);font-weight:700;margin-left:4px}
  .empty{padding:50px;text-align:center;color:var(--sub)}

  /* 상세 */
  .detail{background:#fff;border:1px solid var(--line);border-radius:8px;padding:16px;display:none;max-height:640px;overflow:auto}
  .layout.open .detail{display:block}
  .detail .x{float:right;background:none;border:0;font-size:18px;color:var(--sub);height:auto;padding:0}
  .detail h3{margin:0 0 6px;font-size:15px}
  .kv{display:grid;grid-template-columns:96px 1fr;gap:6px 10px;margin:12px 0;font-size:12.5px}
  .kv dt{color:var(--sub)} .kv dd{margin:0}
  .cmp{width:100%;border:1px solid var(--line);border-radius:6px;margin:8px 0}
  .cmp th,.cmp td{padding:6px 8px;font-size:12px;border-bottom:1px solid #f0f2f5;text-align:left}
  .cmp td.bad{color:var(--fail);font-weight:700}
  .cmp td.good{color:var(--ok);font-weight:700}
  .flow{display:flex;gap:0;margin:14px 0 6px}
  .flow div{flex:1;text-align:center;font-size:11px;padding:7px 2px;background:#eef1f5;color:var(--sub);position:relative}
  .flow div.on{background:var(--pri);color:#fff}
  .flow div.done{background:var(--ok);color:#fff}
  .flow div:first-child{border-radius:5px 0 0 5px} .flow div:last-child{border-radius:0 5px 5px 0}
  .note{font-size:12px;background:#f7f9fc;border-radius:6px;padding:9px 10px;line-height:1.6;margin-top:8px}
  .note.warn{background:var(--wait-l);color:#713f12}
  .dact{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}

  /* 로그 */
  .bottom{display:grid;grid-template-columns:1.4fr 1fr;gap:14px}
  .log{height:220px;overflow:auto;font-family:Consolas,monospace;font-size:12px;background:#0f172a;color:#cbd5e1;border-radius:6px;padding:10px 12px;line-height:1.65}
  .log .t{color:#64748b} .log .ok{color:#4ade80} .log .w{color:#facc15} .log .e{color:#f87171} .log .i{color:#93c5fd}
  .noti{height:220px;overflow:auto;display:flex;flex-direction:column;gap:8px}
  .nt{border:1px solid var(--line);border-left:4px solid var(--c,#6d28d9);border-radius:6px;padding:8px 10px;font-size:12px}
  .nt b{display:block;margin-bottom:2px}
  .nt span{color:var(--sub);font-size:11px}
  .toast{position:fixed;right:24px;bottom:24px;background:#111827;color:#fff;padding:10px 16px;border-radius:6px;opacity:0;transition:.3s;pointer-events:none;z-index:9}
  .toast.show{opacity:1}
  @media(max-width:1200px){.policy{grid-template-columns:repeat(3,1fr)}.layout.open,.bottom{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <h1>기준정보 정합성 점검 · 불일치 유형별 조치</h1>
  <div class="meta">대사 배치 2027-01-02 03:00 실행 결과 | 가상 데이터 예시 화면</div>
</header>

<main>
  <!-- 1. 유형별 조치 정책 -->
  <section class="panel">
    <h2>불일치 유형 및 조치 정책 <small>카드를 클릭하면 해당 유형만 조회됩니다</small></h2>
    <div class="policy" id="policy"></div>
  </section>

  <!-- 2. 탐지 목록 -->
  <section class="panel">
    <div class="bar">
      <div class="l">
        <select id="fSys"><option value="">전체 시스템</option></select>
        <select id="fType"><option value="">전체 유형</option></select>
        <select id="fSt">
          <option value="">전체 상태</option>
          <option value="PENDING">조치 대기</option><option value="WAIT">승인 대기</option>
          <option value="DONE">처리 완료</option><option value="FAIL">처리 실패</option>
        </select>
        <input type="text" id="kw" placeholder="사번 / 성명 / 조직 검색" style="width:180px">
      </div>
      <div class="r">
        <label class="sw"><input type="checkbox" id="dry"> 시뮬레이션(Dry-run)</label>
        <div class="prog" id="prog"><i></i></div>
        <button class="btn-pri" id="btnAuto">자동 조치 실행</button>
        <button class="btn-line" id="btnReset">초기화</button>
      </div>
    </div>

    <div class="layout" id="layout">
      <div class="tbl-wrap"><table id="tbl"></table></div>
      <aside class="detail" id="detail"></aside>
    </div>
  </section>

  <!-- 3. 로그 / 알림 -->
  <section class="bottom">
    <div class="panel" style="margin:0">
      <h2>조치 실행 로그</h2>
      <div class="log" id="log"></div>
    </div>
    <div class="panel" style="margin:0">
      <h2>알림 발송 내역 <small>보안 담당 / 권한 담당 / 조직장</small></h2>
      <div class="noti" id="noti"><div class="empty" style="padding:30px">발송된 알림이 없습니다.</div></div>
    </div>
  </section>
</main>
<div class="toast" id="toast"></div>

<script>

  DIFF:   { name:'값 불일치',          ex:'소속 조직, 직책이 다름',                         act:'자동 재동기화 (ERP 값으로 덮어쓰기)',  mode:'auto',  modeNm:'자동' },

  ['SOD','PORTAL','10001002','최지우','50001100 인사팀','직무: 급여',
     {erp:'충돌 룰 SOD-07: 급여계산 ↔ 급여이체승인', tgt:'보유: PAY_RUN + PAY_TRANSFER_APPR'}, 'SoD 룰 SOD-07'],
  ['SOD','APPR','10001001','김민준','50001100 인사팀','2027-01-01 팀장 보임 + 겸직(총무팀)',
     {erp:'충돌 룰 SOD-11: 구매요청 ↔ 구매승인', tgt:'보유: 총무_구매요청 + 결재_팀장'}, 'SoD 룰 SOD-11'],
];

let ITEMS = [];
function init(){
  ITEMS = RAW.map((r,i)=>({
    id:`DT-20270102-${String(i+1).padStart(4,'0')}`, type:r[0], sys:r[1], pernr:r[2], name:r[3], org:r[4],
    cause:r[5], erp:r[6].erp, tgt:r[6].tgt, rule:r[7],
    status: TYPES[r[0]].mode==='appr' ? 'WAIT' : 'PENDING', failOnce: i===1 || i===16, hist:[] ,
  }));
  ITEMS.forEach(it=>it.hist.push([ts(),'탐지','대사 배치에서 불일치 탐지']));
}

/* =========================================================
 *  3. 렌더링
 * ========================================================= */
const $ = id=>document.getElementById(id);
let cur = {type:'', sel:null, running:false};
function ts(){ const d=new Date(); return d.toTimeString().slice(0,8); }
function css(t){ return `--c:var(--${t});--cl:var(--${t}-l)`; }
function tpBadge(t){ return `<span class="tp" style="background:var(--${t}-l);color:var(--${t})">${TYPES[t].name}</span>`; }

Object.entries(SYS).forEach(([k,v])=>$('fSys').insertAdjacentHTML('beforeend',`<option value="${k}">${v}</option>`));
Object.entries(TYPES).forEach(([k,v])=>$('fType').insertAdjacentHTML('beforeend',`<option value="${k}">${v.name}</option>`));

function renderPolicy(){
  $('policy').innerHTML = Object.entries(TYPES).map(([k,t])=>{
    const all = ITEMS.filter(i=>i.type===k), open = all.filter(i=>!['DONE','REJECT'].includes(i.status)).length;
    return `<div class="pc ${cur.type===k?'on':''}" style="${css(k)}" data-t="${k}">
      <div class="nm">${t.name}</div>
      <div class="ex">${t.ex}</div>
      <div class="ac">→ ${t.act}</div>
      <span class="mode m-${t.mode}">${t.modeNm}</span>
      <div class="cnt"><b>${open}</b><span>미처리 / 전체 ${all.length}</span></div></div>`;
  }).join('');
  document.querySelectorAll('.pc').forEach(el=>el.onclick=()=>{
    cur.type = cur.type===el.dataset.t ? '' : el.dataset.t; $('fType').value=cur.type; renderPolicy(); renderTable();
  });
}

function filtered(){
  const s=$('fSys').value, t=$('fType').value, st=$('fSt').value, kw=$('kw').value.trim();
  return ITEMS.filter(i=>(!s||i.sys===s)&&(!t||i.type===t)&&(!st||i.status===st||(st==='DONE'&&i.status==='REJECT'))
    &&(!kw||(i.pernr+i.name+i.org).includes(kw)));
}

function actBtns(i){
  if(i.type==='SOD' && i.status==='WAIT')
    return `<button class="btn-ok btn-xs" data-a="approve">회수 승인</button> <button class="btn-line btn-xs" data-a="except">예외 승인</button>`;
  if(i.status==='PENDING'||i.status==='FAIL'||i.status==='SIM') return `<button class="btn-line btn-xs" data-a="run">${i.status==='FAIL'?'재시도':'개별 조치'}</button>`;
  return '<span style="color:#a0a7b4">-</span>';
}

function renderTable(){
  const rows = filtered();
  let h = `<thead><tr><th>유형</th><th>탐지 ID</th><th>시스템</th><th>사번 / 성명</th><th>발생 원인 (ERP 발령)</th>
    <th>불일치 내용</th><th>근거</th><th>조치 방식</th><th>상태</th><th>작업</th></tr></thead><tbody>`;
  if(!rows.length) h+=`<tr><td colspan="10" class="empty">조회 결과가 없습니다.</td></tr>`;
  rows.forEach(i=>{
    h += `<tr data-id="${i.id}" class="${cur.sel===i?'sel':''} ${i._flash?'flash':''}">
      <td>${tpBadge(i.type)}</td><td class="id">${i.id}</td><td>${SYS[i.sys]}</td>
      <td class="who"><b>${i.name}</b><span>${i.pernr} · ${i.org}</span></td>
      <td style="font-size:12px">${i.cause}</td>
      <td><div class="vs"><span class="e">${i.erp}</span><span class="t">${i.tgt}</span></div></td>
      <td class="rule">${i.rule}</td>
      <td style="font-size:12px">${TYPES[i.type].act}${i.type==='SOD'?'<span class="lock">🔒자동회수 금지</span>':''}</td>
      <td><span class="st s-${i.status}">${ST[i.status]}</span></td>
      <td style="white-space:nowrap">${actBtns(i)}</td></tr>`;
    i._flash=false;
  });
  $('tbl').innerHTML = h+'</tbody>';
  $('tbl').querySelectorAll('tbody tr[data-id]').forEach(tr=>tr.onclick=e=>{
    const it = ITEMS.find(x=>x.id===tr.dataset.id);
    const a = e.target.dataset.a;
    if(a){ e.stopPropagation(); handle(a,it); return; }
    cur.sel=it; renderTable(); renderDetail();
  });
}

const FLOW = {
  MISSING:['탐지','ERP 재조회','재전송','수신 확인','재대사'],
  ORPHAN: ['탐지','퇴직 확인','계정 잠금','보안 알림','재대사'],
  DIFF:   ['탐지','ERP 값 조회','덮어쓰기','수신 확인','재대사'],
  EXCESS: ['탐지','유예기간 확인','권한 회수','이력 기록','재대사'],
  LACK:   ['탐지','룰 평가','권한 부여','이력 기록','재대사'],
  SOD:    ['탐지','알림 발송','승인 대기','승인 처리','재대사'],
};
const AFTER = {
  MISSING:i=>i.erp.replace(/\/.*$/,'').trim()+' / 계정 생성', ORPHAN:()=>'계정 잠금 (로그인 차단)',
  DIFF:i=>i.erp, EXCESS:()=>'이전 권한 회수 완료', LACK:i=>i.erp.replace('룰상 역할: ','보유: '), SOD:()=>'승인 결과에 따름',
};
const GUIDE = {
  MISSING:'ERP 기준 데이터를 인터페이스로 재전송합니다. 조직 미생성 등 선행 데이터 누락 시 조직 → 사원 순서로 재전송합니다.',
  ORPHAN:'계정을 즉시 잠그고(삭제 아님) 보안 담당에게 알립니다. 퇴직 후 로그인 이력이 있으면 보안 점검 대상으로 분류합니다.',
  DIFF:'ERP(마스터) 값으로 대상 시스템 값을 덮어씁니다. 대상 시스템에서 수기로 변경한 이력이 있으면 함께 기록합니다.',
  EXCESS:'이동 후 유예기간(인수인계 기간)이 지난 이전 조직 권한을 자동 회수합니다. 회수 근거(발령번호)를 이력으로 남깁니다.',
  LACK:'권한 룰(조직/직책/직무 → 역할)에 따라 필요한 기본 권한을 자동 부여합니다. 민감 권한은 룰 대상에서 제외됩니다.',
  SOD:'충돌 권한은 업무 중단 위험이 있어 자동 회수하지 않습니다. 권한 담당/조직장 승인 후 회수하거나, 사유를 남기고 예외 승인합니다.',
};

function renderDetail(){
  const i = cur.sel; if(!i){ $('layout').classList.remove('open'); return; }
  const steps = FLOW[i.type];
  const done = i.status==='DONE'||i.status==='REJECT';
  const stage = done?steps.length : i.status==='WAIT'?2 : i.status==='RUNNING'?2 : i.status==='SIM'?1 : 0;
  let h = `<button class="x" onclick="cur.sel=null;renderTable();renderDetail()">×</button>
    <h3>${i.name} <span style="font-weight:400;color:var(--sub);font-size:12px">${i.pernr}</span></h3>
    ${tpBadge(i.type)} <span class="st s-${i.status}">${ST[i.status]}</span>
    <dl class="kv"><dt>탐지 ID</dt><dd class="id">${i.id}</dd><dt>연계 시스템</dt><dd>${SYS[i.sys]}</dd>
      <dt>소속</dt><dd>${i.org}</dd><dt>발생 원인</dt><dd>${i.cause}</dd><dt>근거</dt><dd>${i.rule}</dd>
      <dt>조치 방식</dt><dd><b>${TYPES[i.type].act}</b></dd></dl>
    <table class="cmp"><thead><tr><th></th><th>내용</th></tr></thead><tbody>
      <tr><th>ERP 기준</th><td>${i.erp}</td></tr>
      <tr><th>조치 전 (대상)</th><td class="bad">${i.tgt}</td></tr>
      <tr><th>조치 후 (대상)</th><td class="${done?'good':''}">${done ? (i.status==='REJECT'?'예외 승인 - 권한 유지 (기한 90일)':AFTER[i.type](i)) : '<span style="color:#a0a7b4">조치 전</span>'}</td></tr>
    </tbody></table>
    <div class="flow">${steps.map((s,k)=>`<div class="${k<stage?'done':k===stage&&!done?'on':''}">${s}</div>`).join('')}</div>
    <div class="note ${i.type==='SOD'?'warn':''}">${GUIDE[i.type]}</div>
    <div class="note"><b>처리 이력</b><br>${i.hist.map(h=>`${h[0]} · <b>${h[1]}</b> ${h[2]}`).join('<br>')}</div>
    <div class="dact">${actBtns(i)}</div>`;
  $('detail').innerHTML = h; $('layout').classList.add('open');
  $('detail').querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>handle(b.dataset.a,i));
}

/* =========================================================
 *  4. 조치 처리
 * ========================================================= */
function log(cls,msg){ $('log').insertAdjacentHTML('beforeend',`<div><span class="t">[${ts()}]</span> <span class="${cls}">${msg}</span></div>`); $('log').scrollTop=1e9; }
function notify(color,title,body){
  const n=$('noti'); if(n.querySelector('.empty')) n.innerHTML='';
  n.insertAdjacentHTML('afterbegin',`<div class="nt" style="--c:${color}"><b>${title}</b>${body}<br><span>${ts()} · 메신저/메일 발송</span></div>`);
}

function execOne(i){
  return new Promise(res=>{
    const dry = $('dry').checked;
    i.status='RUNNING'; refresh();
    setTimeout(()=>{
      if(dry){ i.status='SIM'; i.hist.push([ts(),'시뮬레이션',`조치 예정: ${TYPES[i.type].act}`]);
        log('i',`[DRY-RUN] ${i.id} ${SYS[i.sys]} ${i.name} → ${TYPES[i.type].act} (실제 반영 안 함)`); i._flash=true; refresh(); return res(); }
      if(i.failOnce){ i.failOnce=false; i.status='FAIL';
        i.hist.push([ts(),'실패','대상 시스템 응답 Timeout → 재처리 큐(DLQ) 적재']);
        log('e',`✕ ${i.id} ${SYS[i.sys]} ${i.name} 처리 실패 (Timeout) → DLQ 적재, 재시도 필요`); i._flash=true; refresh(); return res(); }
      const msg = {
        MISSING:`ERP 데이터 재전송 → ${SYS[i.sys]} 수신 확인 (계정 생성)`,
        ORPHAN:`${SYS[i.sys]} 계정 잠금 완료`,
        DIFF:`ERP 값으로 덮어쓰기: ${i.erp}`,
        EXCESS:`이전 권한 회수: ${i.tgt.replace('보유: ','')}`,
        LACK:`권한 부여: ${i.erp.replace('룰상 역할: ','')}`,
      }[i.type];
      i.status='DONE'; i.hist.push([ts(),'완료',msg]); i.hist.push([ts(),'재대사','ERP ↔ 대상 일치 확인']);
      log('ok',`✓ ${i.id} ${SYS[i.sys]} ${i.name} : ${msg}`);
      if(i.type==='ORPHAN') notify('#6d28d9',`[보안] 퇴직자 활성 계정 잠금 - ${i.name}(${i.pernr})`,
        `${SYS[i.sys]} · ${i.tgt}<br>퇴직 후 접속 이력 확인 요망`);
      i._flash=true; refresh(); res();
    }, 260);
  });
}

async function runAuto(){
  if(cur.running) return;
  const targets = ITEMS.filter(i=>TYPES[i.type].mode!=='appr' && ['PENDING','FAIL','SIM'].includes(i.status));
  const sods = ITEMS.filter(i=>i.type==='SOD' && i.status==='WAIT' && !i._notified);
  if(!targets.length && !sods.length){ toast('자동 조치 대상이 없습니다.'); return; }
  cur.running=true; $('btnAuto').disabled=true; $('prog').style.display='block';
  log('i',`▶ 자동 조치 시작 ${$('dry').checked?'(시뮬레이션)':''} - 자동 대상 ${targets.length}건, SoD 승인요청 ${sods.length}건`);
  let n=0; const total=targets.length+sods.length;
  for(const i of targets){ await execOne(i); $('prog').firstElementChild.style.width=(++n/total*100)+'%'; }
  for(const i of sods){
    if(!$('dry').checked){ i._notified=true; i.hist.push([ts(),'알림','권한 담당 / 조직장 승인 요청 발송']);
      notify('#111827',`[SoD] 충돌 권한 승인 요청 - ${i.name}(${i.pernr})`,`${SYS[i.sys]} · ${i.tgt}<br>${i.rule} · 자동 회수 금지, 승인 필요`); }
    log('w',`⚠ ${i.id} ${SYS[i.sys]} ${i.name} SoD 위반 → 승인 요청 (자동 회수 금지)`);
    $('prog').firstElementChild.style.width=(++n/total*100)+'%';
    await new Promise(r=>setTimeout(r,120));
  }
  const fail = ITEMS.filter(i=>i.status==='FAIL').length;
  log('i',`■ 자동 조치 종료 - 완료 ${ITEMS.filter(i=>i.status==='DONE').length} / 실패 ${fail} / 승인대기 ${ITEMS.filter(i=>i.status==='WAIT').length}`);
  cur.running=false; $('btnAuto').disabled=false;
  setTimeout(()=>{ $('prog').style.display='none'; $('prog').firstElementChild.style.width='0'; },800);
  toast(fail?`자동 조치 완료 (실패 ${fail}건 재시도 필요)`:'자동 조치 완료');
}

function handle(a,i){
  if(a==='run'){ execOne(i); return; }
  if(a==='approve'){
    i.status='DONE'; i.hist.push([ts(),'승인','권한 담당 승인 → 충돌 권한 중 1건 회수']);
    log('ok',`✓ ${i.id} ${i.name} SoD 회수 승인 → 충돌 권한 회수 완료`);
  }
  if(a==='except'){
    i.status='REJECT'; i.hist.push([ts(),'예외 승인','업무상 필요 사유로 90일 한시 유지 (보완통제: 월별 모니터링)']);
    log('w',`△ ${i.id} ${i.name} SoD 예외 승인 (90일 한시, 보완통제 적용)`);
  }
  i._flash=true; refresh();
}

function refresh(){ renderPolicy(); renderTable(); if(cur.sel) renderDetail(); }
function toast(m){ const t=$('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),2400); }

$('btnAuto').onclick = runAuto;
$('btnReset').onclick = ()=>{ if(cur.running) return; init(); cur.sel=null; $('log').innerHTML='';
  $('noti').innerHTML='<div class="empty" style="padding:30px">발송된 알림이 없습니다.</div>'; log('i','초기화 - 대사 배치 결과 재로딩'); refresh(); };
['fSys','fSt'].forEach(id=>$(id).onchange=renderTable);
$('fType').onchange=()=>{ cur.type=$('fType').value; renderPolicy(); renderTable(); };
$('kw').oninput=renderTable;

init(); log('i',`대사 배치 결과 로딩 - 탐지 ${ITEMS.length}건`); refresh();
</script>
</body>
</html>
