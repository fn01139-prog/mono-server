name: Sync pending feedback to GitHub Issues

# Claude Code 세션의 네트워크 정책이 배포 서버(Railway)를 막고 있어도 GitHub Actions
# 러너는 인터넷이 열려있으므로, 여기서 대신 mono-server의 처리 대기 신고를 조회해
# GitHub Issue로 남긴다. Claude는 GitHub만 보고 신고 내용을 파악해 처리할 수 있다.
# 자세한 흐름: .claude/skills/mono-feedback-batch.md

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch: {}

permissions:
  issues: write
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Sync pending feedback → issues
        env:
          FEEDBACK_URL: ${{ vars.FEEDBACK_URL || 'https://fn0113.up.railway.app' }}
          FEEDBACK_API_KEY: ${{ secrets.FEEDBACK_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/feedback-sync-issues.js
