<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>로그인 · Yu's App Hub</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', sans-serif; background: #0f0f0f; color: #e0e0e0;
    display: flex; align-items: center; justify-content: center; height: 100vh;
  }
  .card {
    width: 340px; background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 12px;
    padding: 32px;
  }
  h1 { font-size: 1.3rem; color: #fff; margin-bottom: 4px; text-align: center; }
  p.sub { color: #888; font-size: 0.85rem; text-align: center; margin-bottom: 24px; }
  label { display: block; font-size: 0.8rem; color: #aaa; margin-bottom: 6px; margin-top: 14px; }
  input {
    width: 100%; padding: 10px 12px; background: #0f0f0f; border: 1px solid #2a2a2a;
    border-radius: 8px; color: #e0e0e0; font-size: 0.95rem;
  }
  input:focus { outline: none; border-color: #4a9eff; }
  button {
    width: 100%; margin-top: 22px; padding: 11px; background: #4a9eff; color: #fff;
    border: none; border-radius: 8px; font-size: 0.95rem; font-weight: 600; cursor: pointer;
  }
  button:hover { background: #3a8eef; }
  button:disabled { opacity: 0.6; cursor: not-allowed; }
  .error {
    margin-top: 14px; padding: 10px 12px; background: #2a1414; border: 1px solid #5a2424;
    border-radius: 8px; color: #ff8080; font-size: 0.85rem; display: none;
  }
</style>
</head>
<body>
  <form class="card" id="loginForm">
    <h1>🗂 Yu's App Hub</h1>
    <p class="sub">로그인이 필요합니다</p>
    <label for="loginId">아이디</label>
    <input id="loginId" name="loginId" autocomplete="username" required>
    <label for="password">비밀번호</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <div class="error" id="errorBox"></div>
    <button type="submit" id="submitBtn">로그인</button>
  </form>

  <script>
    const form = document.getElementById('loginForm');
    const errorBox = document.getElementById('errorBox');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorBox.style.display = 'none';
      submitBtn.disabled = true;
      submitBtn.textContent = '로그인 중...';

      try {
        const res = await fetch('/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({
            loginId: document.getElementById('loginId').value,
            password: document.getElementById('password').value,
          }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || '로그인에 실패했습니다');

        const params = new URLSearchParams(location.search);
        const next = params.get('next') || '/';
        location.href = next;
      } catch (err) {
        errorBox.textContent = err.message;
        errorBox.style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.textContent = '로그인';
      }
    });
  </script>
</body>
</html>
